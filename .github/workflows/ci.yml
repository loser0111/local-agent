# CI：每次推送 / PR 都跑一遍 Go 与前端的最小验证。
#
# 两个不那么显然、但踩不准就会直接失败的点：
#
# 1) Wails v2 在 Linux 上是 cgo 程序。根包（main.go 里的 github.com/wailsapp/wails/v2）
#    需要 GTK3 + WebKit2GTK 的 C 头文件才能编译，裸 runner 上 go build ./... 会报
#    "libwebkit2gtk-4.0 找不到"。ubuntu-latest（24.04）已不再提供 4.0，所以装 4.1
#    并在所有 go 命令上加 -tags webkit2_41（Wails 官方在 24.04 上的推荐做法）。
#
# 2) main.go 有 //go:embed all:frontend/dist，而 frontend/dist 在 .gitignore 里——
#    干净检出后该目录根本不存在，直接 go build ./... 会以
#    "pattern all:frontend/dist: no matching files found" 失败。
#    所以 go 作业依赖 frontend 作业产出的真实 dist，而不是先跑 go。
name: CI

on:
  push:
  pull_request:

# 同一分支的新推送取消仍在排队/运行的旧任务，避免重复排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本流水线只读代码
permissions:
  contents: read

jobs:
  frontend:
    name: 前端（构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build

      # 产物交给 go 作业：main.go 的 go:embed 需要真实的 frontend/dist。
      # path 相对仓库根（working-directory 只影响 run 步骤，不影响 uses）。
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  go:
    name: Go（构建 / vet / 测试）
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Wails 的 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt 是**阻断门禁**：格式不一致会持续制造 review 噪音，也说明提交前没跑格式化。
      # 放在最前——它不需要编译、不需要 GTK/前端产物，失败得最快，能在装依赖之前就拦住。
      # 与 go build/vet/test 一样用 `./...` 的等价范围（`gofmt -l .` 会跳过非 Go 文件）。
      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt，请本地运行 gofmt -w . 后重新提交："
            echo "$unformatted"
            exit 1
          fi

      - name: 取回前端产物（供 go:embed 使用）
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: go build
        run: go build -tags webkit2_41 ./...

      - name: go vet
        run: go vet -tags webkit2_41 ./...

      # 测试是**阻断门禁**。
      #
      # 此前这里挂着 continue-on-error，因为 internal/app 有 2 个既有确定性失败
      # （TestExecutePlanCancel、TestHardCancelAbortsInFlightRequest，都在两级取消子系统）。
      # 2026-10-14 已定位并修复，两者都**不是产品缺陷**：
      #   - 前者：测试助手 newPlanTestApp 没初始化 App.runs（生产代码在 setup 里有），
      #          CancelPlan 命不中运行，于是软取消静默失效、计划跑成 completed；
      #   - 后者：mock handler 不读 request body，net/http 探测不到客户端断开，
      #          srv.Close() 一直等这条连接（测试挂到超时），而客户端侧其实已正常断开——
      #          真实结论被这层假挂起掩盖。
      # 同时修掉一条既有失败 TestSubagentDeclineIsAuditedWithItsOwnStage（子代理的 ask 被
      # 降级成拒绝，却先多记了一条 decision=ask 的审计）与 snapshot/diff/app 里由机器级
      # git-ai（全局 git 配置的 trace2 上报）引起的 TempDir 清理 flaky。
      #
      # -timeout 5m：挂起的用例不必等满 go 默认的 10 分钟，早点失败早点看到。
      - name: go test
        run: go test -tags webkit2_41 -timeout 5m ./...
