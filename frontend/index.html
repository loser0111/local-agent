<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>local-agent</title>
    <style>
        /* 冷启动兜底背景：CSS 资源加载完成前避免白闪（取值与 tokens.css 保持一致） */
        html[data-theme='dark'] { background: #282a36; }
        html[data-theme='light'] { background: #ffffff; }
    </style>
    <script>
        /* 在首帧之前把已保存的主题/字号贴到 <html> 上。
           必须内联在这里：等 main.js 执行时已经画过一帧了，会闪一下。
           默认值需要与 assets/styles/tokens.css、utils/theme.js 保持一致。 */
        (function () {
            var root = document.documentElement
            var theme = 'dark'
            var fontSize = 14
            try {
                var raw = localStorage.getItem('local-agent:settings')
                var saved = raw ? JSON.parse(raw) || {} : {}
                if (saved.theme === 'light' || saved.theme === 'dark' || saved.theme === 'system') {
                    theme = saved.theme
                }
                var n = Number(saved.fontSize)
                if (isFinite(n) && n >= 12 && n <= 20) fontSize = Math.round(n)
            } catch (e) {
                /* localStorage 不可用 / 数据损坏时按默认值走 */
            }
            if (theme === 'system') {
                theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                    ? 'light'
                    : 'dark'
            }
            root.setAttribute('data-theme', theme)
            root.style.setProperty('--font-size-base', fontSize + 'px')
        })()
    </script>
</head>
<body>
<div id="app"></div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
